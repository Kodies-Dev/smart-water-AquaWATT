services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hack
      POSTGRES_PASSWORD: hack
      POSTGRES_DB: smartwater
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hack -d smartwater"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgresql+psycopg2://hack:hack@db:5432/smartwater
      DANE_DIR: /dane
      CACHE_DIR: /app/cache
      WYNIKI_DIR: /app/wyniki
      OLLAMA_URL: http://host.docker.internal:11434   # Ollama na komputerze (poza Dockerem), opcjonalnie
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Dane:/dane:ro           # folder Dane wewnątrz programu
      - ./cache:/app/cache        # pobrana pogoda – potem działa bez internetu
      - ./wyniki:/app/wyniki      # wyniki modeli (metryki, wykresy) widoczne na dysku
      - ./modele:/app/modele      # wytrenowany model (python main.py prognoza --trenuj)

  aplikacja:                       # docker compose up aplikacja  ->  http://localhost:8501
    build: .
    command: ["aplikacja"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      DB_URL: postgresql+psycopg2://hack:hack@db:5432/smartwater
      WYNIKI_DIR: /app/wyniki
      STREAMLIT_ADRES: 0.0.0.0
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./wyniki:/app/wyniki
      - ./modele:/app/modele

volumes:
  pgdata:
